<div class="field" data-field="method">
  <span class="field-label" id="method-label">Brew method</span>
  <mat-form-field>
    <mat-select
      id="method-btn"
      aria-labelledby="method-label"
      placeholder="Choose a method"
      [value]="value()"
      [disabled]="isDisabled()"
      (selectionChange)="select($event.value)"
      (closed)="touch()"
    >
      @for (method of sorted(); track method.id) {
        <mat-option [value]="method.id">
          <span class="method-option">
            <app-method-icon [iconKey]="method.iconKey" />
            {{ method.name }}
          </span>
        </mat-option>
      }
    </mat-select>
    <mat-icon matIconSuffix svgIcon="chevron-down" class="icon-sm" aria-hidden="true" />
  </mat-form-field>
</div>
