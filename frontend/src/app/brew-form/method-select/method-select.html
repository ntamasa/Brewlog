<div class="field" data-field="method">
  <span class="field-label" id="method-label">Brew method</span>
  <mat-form-field>
    <mat-select
      id="method-btn"
      aria-labelledby="method-label"
      placeholder="Choose a method"
      hideSingleSelectionIndicator
      [value]="value()"
      [disabled]="isDisabled()"
      (selectionChange)="select($event.value)"
      (closed)="touch()"
    >
      <mat-select-trigger>
        @if (selected(); as method) {
          <span class="method-value">
            <mat-icon class="icon" [svgIcon]="method.iconKey" aria-hidden="true" />
            <span>{{ method.name }}</span>
          </span>
        }
      </mat-select-trigger>
      @for (method of sorted(); track method.id) {
        <mat-option [value]="method.id">
          <mat-icon class="icon" [svgIcon]="method.iconKey" aria-hidden="true" />
          {{ method.name }}
        </mat-option>
      }
    </mat-select>
    <mat-icon matIconSuffix svgIcon="chevron-down" class="icon-sm" aria-hidden="true" />
  </mat-form-field>
</div>
