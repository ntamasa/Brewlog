<header class="head">
  <h2 class="t-headline-md">Log a brew</h2>
  <button matIconButton type="button" aria-label="Close without saving" (click)="closed.emit()">
    <mat-icon svgIcon="close" class="icon" aria-hidden="true"></mat-icon>
  </button>
</header>

<div class="body" [formGroup]="form">
  <p class="intro">Everything is required except tasting notes.</p>

  <div class="field" data-field="name">
    <label class="field-label" for="name">Brew name</label>
    <mat-form-field>
      <input matInput id="name" formControlName="name" autocomplete="off" cdkFocusInitial />
      <mat-hint class="field-help"
        >A name only you would recognise, like “Sunday Moka”. Must be unique.</mat-hint
      >
    </mat-form-field>
  </div>

  <div class="row-2">
    <div class="field" data-field="bean">
      <label class="field-label" for="bean">Bean name</label>
      <mat-form-field>
        <input matInput id="bean" formControlName="beanName" autocomplete="off" />
      </mat-form-field>
    </div>
    <div class="field" data-field="origin">
      <label class="field-label" for="origin">Origin</label>
      <mat-form-field>
        <input
          matInput
          id="origin"
          formControlName="origin"
          autocomplete="off"
          placeholder="Country or region"
        />
      </mat-form-field>
    </div>
  </div>

  <app-method-select formControlName="methodId" [methods]="methods()" />

  <fieldset class="field" data-field="roast">
    <legend class="field-label">Roast level</legend>
    <mat-button-toggle-group
      class="segmented"
      formControlName="roast"
      aria-label="Roast level"
      hideSingleSelectionIndicator
    >
      <mat-button-toggle value="LIGHT"
        ><span class="swatch swatch-light" aria-hidden="true"></span>Light</mat-button-toggle
      >
      <mat-button-toggle value="MEDIUM"
        ><span class="swatch swatch-medium" aria-hidden="true"></span>Medium</mat-button-toggle
      >
      <mat-button-toggle value="DARK"
        ><span class="swatch swatch-dark" aria-hidden="true"></span>Dark</mat-button-toggle
      >
    </mat-button-toggle-group>
  </fieldset>

  <fieldset class="field" data-field="rating" id="rating">
    <legend class="field-label">Rating</legend>
    <app-bean-rating mode="input" formControlName="rating" />
  </fieldset>

  <div class="field" data-field="date">
    <label class="field-label" for="date">Date</label>
    <mat-form-field>
      <input matInput id="date" [matDatepicker]="picker" [max]="today" formControlName="brewDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker">
        <mat-icon matDatepickerToggleIcon svgIcon="calendar" aria-hidden="true"></mat-icon>
      </mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-hint class="field-help"
        >Defaults to today. Change it if you’re logging an earlier brew.</mat-hint
      >
    </mat-form-field>
  </div>

  <div class="field" data-field="notes">
    <label class="field-label" for="notes">Tasting notes <span class="opt">Optional</span></label>
    <mat-form-field>
      <textarea
        matInput
        id="notes"
        class="textarea"
        formControlName="notes"
        rows="5"
        placeholder="Aroma, acidity, body, finish… and anything you’d change next time."
      ></textarea>
    </mat-form-field>
  </div>
</div>

<footer class="foot">
  <button matButton="outlined" type="button" class="btn-secondary" (click)="closed.emit()">
    Cancel
  </button>
  <button
    matButton="filled"
    type="button"
    [disabled]="saving()"
    [attr.aria-busy]="saving() ? 'true' : null"
    (click)="submit()"
  >
    @if (saving()) {
      <span class="spinner" aria-hidden="true"></span>Saving…
    } @else {
      Add to journal
    }
  </button>
</footer>
