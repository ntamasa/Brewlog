<div class="toolbar" role="search">
  <div class="field">
    <label class="field-label" for="q">Search</label>
    <mat-form-field>
      <mat-icon matIconPrefix svgIcon="search" aria-hidden="true" />
      <input
        matInput
        #searchInput
        id="q"
        type="search"
        placeholder="Search brew names"
        autocomplete="off"
        [value]="query().q"
        (input)="searchChange.emit(searchInput.value)"
      />
    </mat-form-field>
  </div>
  <div class="field desktop-only">
    <span class="field-label" id="f-sort-label">Sort</span>
    <mat-form-field>
      <mat-select
        id="f-sort"
        aria-labelledby="f-sort-label"
        [value]="query().sort"
        (selectionChange)="sort.emit($event.value)"
      >
        <mat-option value="NEWEST">Newest first</mat-option>
        <mat-option value="OLDEST">Oldest first</mat-option>
        <mat-option value="HIGHEST">Highest rated</mat-option>
        <mat-option value="LOWEST">Lowest rated</mat-option>
      </mat-select>
      <mat-icon matIconSuffix svgIcon="chevron-down" class="icon-sm" aria-hidden="true" />
    </mat-form-field>
  </div>
</div>
